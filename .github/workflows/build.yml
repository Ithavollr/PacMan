name: Gradle Build
on:
  push:
    branches: [ "seed" ]
  pull_request:
    branches: [ "seed" ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Run Server Test
        run: ./gradlew runServerTest --stacktrace
        timeout-minutes: 5
